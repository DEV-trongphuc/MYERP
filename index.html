<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/LOGO.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="IDEAS ERP - Hệ thống quản trị doanh nghiệp và tự động hóa AI thông minh." />
    <meta name="theme-color" content="#090d16" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var token = localStorage.getItem('Ideas_token') || localStorage.getItem('access_token');
          var path = window.location.pathname;
          var isLogin = path === '/login' || path.endsWith('/login');
          if (!token || isLogin) {
            document.documentElement.classList.add('hide-initial-splash');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      /* Hide splash screen completely before login */
      html.hide-initial-splash #ideas-splash-screen {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      /* INSTANT DARK RED CYBER SPLASH SCREEN WITH ENHANCED SCI-FI ANIMATIONS */
      #ideas-splash-screen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 2147483647 !important;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background: radial-gradient(ellipse at 50% 35%, #4c0519 0%, #1c0309 48%, #090406 100%);
        overflow: hidden;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.55s ease;
      }
      #ideas-splash-screen.splash-fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      /* Glowing Crimson Nebula / Cloud Backdrop */
      .splash-cloud-bg {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .splash-cloud {
        position: absolute;
        border-radius: 50%;
        animation: floatCloud 14s ease-in-out infinite alternate;
      }
      .splash-cloud-1 {
        width: 480px;
        height: 480px;
        top: -120px;
        left: -100px;
        background: radial-gradient(circle, rgba(225, 29, 72, 0.25) 0%, rgba(136, 19, 55, 0.1) 60%, transparent 100%);
        filter: blur(50px);
      }
      .splash-cloud-2 {
        width: 550px;
        height: 550px;
        top: 40px;
        right: -140px;
        background: radial-gradient(circle, rgba(244, 63, 94, 0.22) 0%, rgba(190, 18, 60, 0.08) 60%, transparent 100%);
        filter: blur(55px);
        animation-duration: 18s;
        animation-delay: -5s;
      }
      .splash-cloud-3 {
        width: 600px;
        height: 400px;
        top: 25%;
        left: 50%;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, rgba(244, 63, 94, 0.35) 0%, rgba(190, 18, 60, 0.14) 55%, transparent 100%);
        filter: blur(60px);
      }
      .splash-cloud-4 {
        width: 400px;
        height: 350px;
        bottom: -50px;
        left: 50%;
        transform: translateX(-50%);
        background: radial-gradient(circle, rgba(136, 19, 55, 0.22) 0%, transparent 70%);
        filter: blur(40px);
      }

      /* Cyber Neon Ring & Orbiting Dashes */
      .splash-cyber-ring {
        position: absolute;
        width: 290px;
        height: 290px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -62%);
        border-radius: 50%;
        border: 1.5px solid rgba(244, 63, 94, 0.4);
        box-shadow: 0 0 45px rgba(244, 63, 94, 0.35), inset 0 0 35px rgba(244, 63, 94, 0.2);
        animation: pulseRing 4s ease-in-out infinite;
        pointer-events: none;
      }
      .splash-cyber-orbit {
        position: absolute;
        width: 320px;
        height: 320px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -62%);
        border-radius: 50%;
        border: 1.5px dashed rgba(251, 191, 36, 0.4);
        box-shadow: 0 0 25px rgba(251, 191, 36, 0.2);
        animation: rotateOrbit 16s linear infinite;
        pointer-events: none;
      }

      /* Sparkles & Star Points */
      .splash-sparkle {
        position: absolute;
        animation: sparkleAnim 3s infinite ease-in-out;
      }
      .sparkle-1 { top: 14%; left: 22%; animation-delay: 0s; font-size: 26px; color: #ff2d55; text-shadow: 0 0 18px rgba(255, 45, 85, 0.95); }
      .sparkle-2 { top: 11%; right: 24%; animation-delay: 1s; font-size: 30px; color: #fbbf24; text-shadow: 0 0 18px rgba(251, 191, 36, 0.95); }
      .sparkle-3 { top: 32%; left: 14%; animation-delay: 1.8s; font-size: 20px; color: #ffffff; text-shadow: 0 0 14px #ffffff; }
      .sparkle-4 { top: 36%; right: 16%; animation-delay: 0.6s; font-size: 24px; color: #f43f5e; text-shadow: 0 0 16px #f43f5e; }

      /* Main Content Container */
      .splash-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: auto 0;
        padding: 20px;
        text-align: center;
        animation: contentEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Mascot Robot Container */
      .splash-mascot-box {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 24px;
      }
      .splash-mascot-img {
        width: 195px;
        height: 195px;
        object-fit: contain;
        background: transparent !important;
        filter: drop-shadow(0 0 45px rgba(244, 63, 94, 0.65)) drop-shadow(0 20px 30px rgba(0, 0, 0, 0.85));
        animation: floatMascot 3.6s ease-in-out infinite;
        will-change: transform;
      }
      .splash-mascot-shadow {
        width: 115px;
        height: 14px;
        background: radial-gradient(ellipse at center, rgba(244, 63, 94, 0.55) 0%, rgba(0, 0, 0, 0) 70%);
        border-radius: 50%;
        margin-top: 6px;
        animation: shadowPulse 3.6s ease-in-out infinite;
      }

      /* HIGH CONTRAST TYPOGRAPHY WITH SHIMMER */
      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .splash-brand-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 2.25rem;
        font-weight: 900;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
      .splash-brand-logo span.ideas-text {
        color: #ffffff;
        text-shadow: 0 0 30px rgba(244, 63, 94, 0.9), 0 2px 8px rgba(0, 0, 0, 0.9);
        animation: glowPulse 3s ease-in-out infinite;
      }
      .splash-brand-logo span.erp-text {
        color: #ff2d55;
        text-shadow: 0 0 30px rgba(255, 45, 85, 0.95), 0 2px 8px rgba(0, 0, 0, 0.9);
        animation: glowPulse 3s ease-in-out infinite 0.5s;
      }

      .splash-badge {
        font-size: 0.71875rem;
        font-weight: 800;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: #ffe4e6;
        background: rgba(225, 29, 72, 0.22);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 5px 20px;
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(244, 63, 94, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        border: 1px solid rgba(244, 63, 94, 0.55);
        animation: badgeGlow 4s ease-in-out infinite;
      }

      /* Loading Progress */
      .splash-progress-wrapper {
        margin-top: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .splash-progress-bar {
        width: 185px;
        height: 5px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      }
      .splash-progress-inner {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #ff2d55, #fbbf24, #ff2d55);
        background-size: 200% 100%;
        border-radius: 10px;
        box-shadow: 0 0 18px rgba(255, 45, 85, 0.95);
        animation: progressSlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .splash-status-text {
        font-size: 0.8125rem;
        font-weight: 700;
        color: #fecdd3;
        letter-spacing: 0.5px;
        text-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
        animation: textPulse 2s ease-in-out infinite;
      }

      /* Footer */
      .splash-footer {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding-bottom: 26px;
      }
      .splash-footer-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.84375rem;
        font-weight: 800;
        color: #ff2d55;
        letter-spacing: 0.6px;
        text-shadow: 0 0 14px rgba(255, 45, 85, 0.7);
      }
      .splash-footer-brand img {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        object-fit: cover;
        box-shadow: 0 0 12px rgba(255, 45, 85, 0.6);
      }
      .splash-copyright {
        font-size: 0.6875rem;
        color: #fda4af;
        font-weight: 600;
        opacity: 0.85;
      }

      /* Keyframes */
      @keyframes contentEnter {
        0% { opacity: 0; transform: scale(0.94) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes floatMascot {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1.5deg); }
      }
      @keyframes shadowPulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(0.8); opacity: 0.22; }
      }
      @keyframes pulseRing {
        0%, 100% { transform: translate(-50%, -62%) scale(1); opacity: 0.65; }
        50% { transform: translate(-50%, -62%) scale(1.08); opacity: 0.95; }
      }
      @keyframes rotateOrbit {
        0% { transform: translate(-50%, -62%) rotate(0deg); }
        100% { transform: translate(-50%, -62%) rotate(360deg); }
      }
      @keyframes floatCloud {
        0% { transform: translate(0, 0); }
        100% { transform: translate(25px, 15px); }
      }
      @keyframes sparkleAnim {
        0%, 100% { transform: scale(0.8); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes progressSlide {
        0% { left: -100%; }
        100% { left: 100%; }
      }
      @keyframes textPulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(244, 63, 94, 0.8)); }
      }
      @keyframes badgeGlow {
        0%, 100% { border-color: rgba(244, 63, 94, 0.55); box-shadow: 0 0 20px rgba(244, 63, 94, 0.25); }
        50% { border-color: rgba(251, 191, 36, 0.7); box-shadow: 0 0 30px rgba(244, 63, 94, 0.45); }
      }

      @media (max-width: 640px) {
        .splash-mascot-img {
          width: 165px;
          height: 165px;
        }
        .splash-cyber-ring {
          width: 240px;
          height: 240px;
        }
        .splash-cyber-orbit {
          width: 270px;
          height: 270px;
        }
        .splash-brand-logo {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- INSTANT DARK RED CYBER SPLASH SCREEN -->
    <div id="ideas-splash-screen">
      <div class="splash-cloud-bg">
        <div class="splash-cloud splash-cloud-1"></div>
        <div class="splash-cloud splash-cloud-2"></div>
        <div class="splash-cloud splash-cloud-3"></div>
        <div class="splash-cloud splash-cloud-4"></div>
        <span class="splash-sparkle sparkle-1">✦</span>
        <span class="splash-sparkle sparkle-2">✦</span>
        <span class="splash-sparkle sparkle-3">✦</span>
        <span class="splash-sparkle sparkle-4">✦</span>
      </div>

      <div class="splash-content">
        <!-- 3D AI Robot Mascot with Dual Cyber Rings -->
        <div class="splash-mascot-box">
          <div class="splash-cyber-ring"></div>
          <div class="splash-cyber-orbit"></div>
          <img 
            src="/ideas_bot_v2.png?v=20260826_clean" 
            alt="IDEAS AI Mascot" 
            class="splash-mascot-img"
            loading="eager"
            onerror="this.style.display='none'"
          />
          <div class="splash-mascot-shadow"></div>
        </div>

        <!-- High Contrast Brand Name (Chữ Trắng & Đỏ Neon Phát Sáng Cực Nét) -->
        <div class="splash-brand">
          <div class="splash-brand-logo">
            <span class="ideas-text">IDEAS</span> <span class="erp-text">ERP</span>
          </div>
          <div class="splash-badge">
            AI AUTOMATION & INTELLIGENT WORKFLOW
          </div>
        </div>

        <!-- Progress Loading Bar -->
        <div class="splash-progress-wrapper">
          <div class="splash-progress-bar">
            <div class="splash-progress-inner"></div>
          </div>
          <div class="splash-status-text">
            Đang khởi động hệ thống...
          </div>
        </div>
      </div>

      <!-- Footer Brand & Copyright -->
      <div class="splash-footer">
        <div class="splash-footer-brand">
          <img src="/LOGO.jpg" alt="Logo" />
          <span>IDEAS - SÁNG TẠO & HIỆU QUẢ</span>
        </div>
        <div class="splash-copyright">
          Copyright © 2026 IDEAS JSC • All rights reserved.
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
